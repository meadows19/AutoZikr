name: Build Native macOS DMG

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-14 # GitHub Apple Silicon M1 Runner
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Build native release binaries for Apple Silicon (aarch64) and Intel (x86_64)
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin

      - name: Create Universal 2 macOS App Bundle (.app)
        run: |
          mkdir -p AutoZikr.app/Contents/MacOS
          mkdir -p AutoZikr.app/Contents/Resources
          lipo -create target/aarch64-apple-darwin/release/autozikr target/x86_64-apple-darwin/release/autozikr -output AutoZikr.app/Contents/MacOS/autozikr
          cp Info.plist AutoZikr.app/Contents/Info.plist
          chmod +x AutoZikr.app/Contents/MacOS/autozikr

          # Generate macOS .icns icon bundle
          mkdir -p icon.iconset
          sips -z 16 16     app_icon.png --out icon.iconset/icon_16x16.png
          sips -z 32 32     app_icon.png --out icon.iconset/icon_16x16@2x.png
          sips -z 32 32     app_icon.png --out icon.iconset/icon_32x32.png
          sips -z 64 64     app_icon.png --out icon.iconset/icon_32x32@2x.png
          sips -z 128 128   app_icon.png --out icon.iconset/icon_128x128.png
          sips -z 256 256   app_icon.png --out icon.iconset/icon_128x128@2x.png
          sips -z 256 256   app_icon.png --out icon.iconset/icon_256x256.png
          iconutil -c icns icon.iconset -o AutoZikr.app/Contents/Resources/app_icon.icns

      - name: Package into macOS Disk Image (.dmg)
        run: |
          mkdir -p dist
          mkdir -p dmg_root
          cp -R AutoZikr.app dmg_root/
          ln -s /Applications dmg_root/Applications
          hdiutil create -volname "AutoZikr" -srcfolder dmg_root -ov -format UDZO dist/AutoZikr_macOS_Universal.dmg

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoZikr_macOS_Universal.dmg
          path: dist/AutoZikr_macOS_Universal.dmg

      - name: Release Asset Upload
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: dist/AutoZikr_macOS_Universal.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
